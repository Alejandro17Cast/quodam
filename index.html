<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Quodam, una biblioteca digital de lecturas cortas donde cada historia encuentra a su lector."
  >

  <meta
    name="theme-color"
    content="#111827"
  >

  <title>
    Quodam — Lecturas que te encuentran
  </title>

  <link
    rel="stylesheet"
    href="./css/main.css"
  >
  <link
  rel="stylesheet"
  href="./css/animations.css"
>

<link
  rel="stylesheet"
  href="./css/components/buttons.css"
>

<link
  rel="stylesheet"
  href="./css/components/book.css"
>

<link
  rel="stylesheet"
  href="./css/pages/home.css"
>
</head>


<body>

  <main
    id="app"
    class="app"
  >

    <!-- =====================================================
         BIENVENIDA
    ====================================================== -->

    <section
      id="welcome"
      class="scene scene--active"
      aria-labelledby="welcome-title"
    >

      <div class="welcome__content">

        <p class="welcome__eyebrow">
  Tu aventura de lectura
</p>


        <h1
          id="welcome-title"
          class="brand"
        >
          Quodam
        </h1>


        <p class="welcome__phrase">
  Cada lectura es una aventura.

  <span>
    ¿Cuál te encontrará hoy?
  </span>
</p>


       <div
  id="mode-selector"
  class="mode-selector"
>




  <div class="mode-selector__grid">

    <!-- ESPAÑOL -->

    <button
      class="
        mode-card
        mode-card--spanish
      "
      type="button"
      data-reading-mode="es"
    >
      <span
        class="mode-card__icon"
        aria-hidden="true"
      >
        ¡Hola!
      </span>

      <span class="mode-card__name">
        Español
      </span>

      <span class="mode-card__description">
        Descubre una lectura en español
      </span>

      <span
        class="mode-card__action"
        aria-hidden="true"
      >
        Comenzar →
      </span>
    </button>


    <!-- ENGLISH -->

    <button
      class="
        mode-card
        mode-card--english
      "
      type="button"
      data-reading-mode="en"
    >
      <span
        class="mode-card__icon"
        aria-hidden="true"
      >
        Hello!
      </span>

      <span class="mode-card__name">
        English
      </span>

      <span class="mode-card__description">
        Discover a reading in English
      </span>

      <span
        class="mode-card__action"
        aria-hidden="true"
      >
        Start →
      </span>
    </button>


    <!-- MIXTO -->

    <button
      class="
        mode-card
        mode-card--mixed
      "
      type="button"
      data-reading-mode="mixed"
    >
      <span
        class="mode-card__icon"
        aria-hidden="true"
      >
        Hola + Hello
      </span>

      <span class="mode-card__name">
        Mixto
      </span>

      <span class="mode-card__description">
        Una aventura en dos idiomas
      </span>

      <span
        class="mode-card__action"
        aria-hidden="true"
      >
        Explorar →
      </span>
    </button>

  </div>


  <p
    id="mode-status"
    class="mode-selector__status"
    aria-live="polite"
  ></p>

</div>

      </div>

    </section>



    <!-- =====================================================
         DESCUBRIMIENTO
    ====================================================== -->

    <section
      id="discovery"
      class="scene"
      aria-labelledby="discovery-title"
    >

      <h2
        id="discovery-title"
        class="sr-only"
      >
        Descubriendo una lectura
      </h2>


      <!-- ===================================================
           LIBRO
      ==================================================== -->

      <div
        id="book"
        class="book book--closed"
        aria-busy="false"
      >

        <!-- ================================================
             DESTELLOS DECORATIVOS
        ================================================= -->

        <div
          id="book-sparkles"
          class="book__sparkles"
          aria-hidden="true"
        >
          <span>✦</span>
          <span>✧</span>
          <span>✦</span>
          <span>✧</span>
          <span>✦</span>
        </div>


        <!-- ================================================
             SOMBRA
        ================================================= -->

        <div
          class="book__shadow"
          aria-hidden="true"
        ></div>


        <!-- ================================================
             CUBIERTA INFERIOR
        ================================================= -->

        <div
          class="book__cover book__cover--back"
          aria-hidden="true"
        ></div>



        <!-- =================================================
             CONJUNTO DE PÁGINAS

             REGLA:
             - izquierda = ilustración
             - derecha   = título + extracto

             Ambas páginas representan SIEMPRE
             la misma lectura.
        ================================================== -->

        <div class="book__sheets">


          <!-- ==============================================
               PÁGINA IZQUIERDA
               ILUSTRACIÓN
          =============================================== -->

          <section
            class="book__page book__page--left"
            aria-label="Ilustración de la lectura"
          >

            <div class="book__page-inner">


              <!-- Ritual inicial -->

              <div
                id="ritual"
                class="book__ritual"
              >

                <span
                  class="book__ritual-symbol"
                  aria-hidden="true"
                >
                  ✦
                </span>


                <p class="book__ritual-text">
                  Toda lectura espera
                  al lector correcto.
                </p>

              </div>


              <!--
                readingRenderer.js inserta aquí
                la ilustración de la lectura.
              -->

              <div
                id="left-page-content"
                class="book__page-content"
              ></div>

            </div>

          </section>



          <!-- ==============================================
               PÁGINA DERECHA
               TEXTO + ACCIONES
          =============================================== -->

          <section
            class="book__page book__page--right"
            aria-label="Información de la lectura"
          >

            <div class="book__page-inner">


              <!-- ==========================================
                   COMPATIBILIDAD TEMPORAL

                   main.js todavía valida estos elementos,
                   pero la experiencia nueva utiliza
                   #right-page-content.
              =========================================== -->

              <div
                id="story-preview"
                class="story-preview"
                hidden
              >

                <p class="story-preview__status">
                  Buscando entre las páginas...
                </p>


                <div
                  class="story-preview__image-wrapper"
                >

                  <img
                    id="preview-image"
                    class="story-preview__image"
                    src=""
                    alt=""
                  >

                </div>


                <p
                  id="preview-title"
                  class="story-preview__title"
                ></p>

              </div>



              <!-- ==========================================
                   CONTENIDO PRINCIPAL

                   readingRenderer.js inserta aquí:
                   - categoría
                   - título
                   - nivel
                   - tiempo
                   - extracto
              =========================================== -->

              <div
                id="right-page-content"
                class="book__page-content"
              ></div>



              <!-- ==========================================
                   RESULTADO / ACCIONES

                   Se conserva porque main.js y
                   revealAnimation.js todavía trabajan
                   con estos IDs.

                   En una siguiente limpieza puede
                   simplificarse para mostrar únicamente
                   las acciones sobre la página derecha.
              =========================================== -->

              <article
                id="story-result"
                class="story-result"
                aria-labelledby="result-title"
                hidden
              >

                <span
                  id="result-star"
                  class="story-result__star"
                  aria-hidden="true"
                >
                  ✦
                </span>


                <p
                  id="result-eyebrow"
                  class="story-result__eyebrow"
                >
                  La lectura te encontró
                </p>


                <div
                  id="result-cover-wrapper"
                  class="story-result__cover-wrapper"
                >

                  <img
                    id="result-image"
                    class="story-result__cover"
                    src=""
                    alt=""
                  >

                </div>


                <h2
                  id="result-title"
                  class="story-result__title"
                ></h2>


                <p
                  id="result-description"
                  class="story-result__description"
                ></p>


                <div
                  id="result-actions"
                  class="story-result__actions"
                >

                  <button
                    id="read-button"
                    class="button button--primary"
                    type="button"
                    aria-disabled="true"
                  >
                    Comenzar a leer
                  </button>


                  <button
                    id="again-button"
                    class="button button--secondary"
                    type="button"
                  >
                    Descubrir otra lectura
                  </button>

                </div>

              </article>

            </div>

          </section>



          <!-- ==============================================
               HOJA ANIMADA

               Esta es la única hoja responsable
               del giro visual.
          =============================================== -->

          <div
            id="turning-page"
            class="book__turning-page"
            aria-hidden="true"
            aria-busy="false"
          >

            <div
              class="
                book__turning-face
                book__turning-face--front
              "
            >

              <div
                id="turning-front-content"
                class="book__page-content"
              ></div>

            </div>



            <div
              class="
                book__turning-face
                book__turning-face--back
              "
            >

              <div
                id="turning-back-content"
                class="book__page-content"
              ></div>

            </div>

          </div>

        </div>



        <!-- =================================================
             LOMO CENTRAL
        ================================================== -->

        <div
          class="book__spine"
          aria-hidden="true"
        ></div>


        <!-- =================================================
             CUBIERTA DECORATIVA
        ================================================== -->

        <div
          class="book__cover book__cover--front"
          aria-hidden="true"
        ></div>

      </div>

    </section>



    <!-- =====================================================
         REGIÓN ACCESIBLE
    ====================================================== -->

    <div
      id="live-region"
      class="sr-only"
      aria-live="polite"
      aria-atomic="true"
    ></div>

  </main>



  <!-- =======================================================
       JAVASCRIPT
  ======================================================== -->

  <script
    type="module"
    src="./js/main.js"
  ></script>

</body>

</html>
