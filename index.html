<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Quodam, una biblioteca digital de lecturas cortas donde cada texto encuentra a su lector."
  >

  <title>Quodam — Descubre una lectura</title>

  <link
    rel="stylesheet"
    href="./css/main.css"
  >
</head>


<body>

  <main class="app">

    <!-- =========================
         BIENVENIDA
    ========================== -->

    <section
      id="welcome"
      class="scene scene--active"
      aria-labelledby="welcome-title"
    >

      <div class="welcome__content">

        <p class="welcome__eyebrow">
          Una biblioteca diferente
        </p>


        <h1
          id="welcome-title"
          class="brand"
        >
          Quodam
        </h1>


        <p class="welcome__phrase">
          Las historias no se buscan,
          <span>
            ellas te encuentran.
          </span>
        </p>


       <button
  id="discover-button"
  class="button button--primary"
  type="button"
  disabled
>
  Preparando Quodam...
</button>

      </div>

    </section>



    <!-- =========================
         LIBRO / DESCUBRIMIENTO
    ========================== -->

    <section
      id="discovery"
      class="scene"
      aria-labelledby="discovery-title"
    >

      <h2
        id="discovery-title"
        class="sr-only"
      >
        Buscando una lectura
      </h2>


      <!-- =========================
           LIBRO
      ========================== -->

      <div
  id="book"
  class="book book--closed"
>

  <div class="book__shadow"></div>

  <div class="book__cover book__cover--back"></div>

  <div class="book__sheets">

    <section
      class="book__page book__page--left"
      aria-label="Página izquierda"
    >

      <div class="book__page-inner">

        <div
          id="left-page-content"
          class="book__page-content"
        >
          <p class="book__ritual-text">
            Toda lectura espera
            al lector correcto.
          </p>
        </div>

        <span
          class="book__page-number"
          aria-hidden="true"
        >
          12
        </span>

      </div>

    </section>


    <section
      class="book__page book__page--right"
      aria-label="Página derecha"
    >

      <div class="book__page-inner">

        <div
          id="right-page-content"
          class="book__page-content"
        ></div>

        <span
          class="book__page-number"
          aria-hidden="true"
        >
          13
        </span>

      </div>

    </section>


    <div
      id="turning-page"
      class="book__turning-page"
      aria-hidden="true"
    >

      <div
        class="book__turning-face book__turning-face--front"
      >
        <div
          id="turning-front-content"
          class="book__page-content"
        ></div>
      </div>


      <div
        class="book__turning-face book__turning-face--back"
      >
        <div
          id="turning-back-content"
          class="book__page-content"
        ></div>
      </div>

    </div>

  </div>


  <div
    class="book__spine"
    aria-hidden="true"
  ></div>


  <div
    class="book__cover book__cover--front"
    aria-hidden="true"
  ></div>

</div>

    </section>



    <!-- =========================
         MENSAJES ACCESIBLES
    ========================== -->

    <div
      id="live-region"
      class="sr-only"
      aria-live="polite"
      aria-atomic="true"
    ></div>

  </main>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script
    type="module"
    src="./js/main.js"
  ></script>

</body>

</html>
