<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Quodam, una biblioteca digital de lecturas cortas donde cada texto encuentra a su lector."
  >

  <title>Quodam — Descubre una lectura</title>

  <link
    rel="stylesheet"
    href="./css/main.css"
  >
</head>


<body>

  <main class="app">

    <!-- =========================
         BIENVENIDA
    ========================== -->

    <section
      id="welcome"
      class="scene scene--active"
      aria-labelledby="welcome-title"
    >

      <div class="welcome__content">

        <p class="welcome__eyebrow">
          Una biblioteca diferente
        </p>


        <h1
          id="welcome-title"
          class="brand"
        >
          Quodam
        </h1>


        <p class="welcome__phrase">
          Las historias no se buscan,
          <span>
            ellas te encuentran.
          </span>
        </p>


        <button
          id="discover-button"
          class="button button--primary"
          type="button"
        >
          Descubrir una lectura
        </button>

      </div>

    </section>



    <!-- =========================
         LIBRO / DESCUBRIMIENTO
    ========================== -->

    <section
      id="discovery"
      class="scene"
      aria-labelledby="discovery-title"
    >

      <h2
        id="discovery-title"
        class="sr-only"
      >
        Buscando una lectura
      </h2>


      <!-- =========================
           LIBRO
      ========================== -->

      <div
        id="book"
        class="book book--closed"
      >

        <div class="book__page">


          <!-- =========================
               HOJA ANIMADA
          ========================== -->

          <div
            id="page-turn"
            class="book__page-turn"
            aria-hidden="true"
          ></div>



          <!-- =========================
               FRASE RITUAL
          ========================== -->

          <div
            id="ritual"
            class="book__ritual"
          >

            <p>
              Toda lectura espera
              al lector correcto.
            </p>

          </div>



          <!-- =========================
               SELECCIÓN RÁPIDA
          ========================== -->

          <div
            id="story-preview"
            class="story-preview"
            hidden
          >

            <div
              class="story-preview__image-wrapper"
            >

              <img
                id="preview-image"
                class="story-preview__image"
                src=""
                alt=""
              >

            </div>


            <p
              id="preview-title"
              class="story-preview__title"
            ></p>

          </div>



          <!-- =========================
               RESULTADO
          ========================== -->

          <article
            id="story-result"
            class="story-result"
            hidden
          >

            <p
              id="result-eyebrow"
              class="story-result__eyebrow"
            >
              Lectura encontrada
            </p>


            <div
              id="result-cover-wrapper"
              class="story-result__cover-wrapper"
            >

              <img
                id="result-image"
                class="story-result__cover"
                src=""
                alt=""
              >

            </div>


            <h2
              id="result-title"
              class="story-result__title"
            ></h2>


            <p
              id="result-description"
              class="story-result__description"
            ></p>


            <div
              id="result-actions"
              class="story-result__actions"
            >

              <button
                id="read-button"
                class="button button--primary"
                type="button"
              >
                Comenzar a leer
              </button>


              <button
                id="again-button"
                class="button button--secondary"
                type="button"
              >
                Descubrir otra lectura
              </button>

            </div>

          </article>

        </div>

      </div>

    </section>



    <!-- =========================
         MENSAJES ACCESIBLES
    ========================== -->

    <div
      id="live-region"
      class="sr-only"
      aria-live="polite"
      aria-atomic="true"
    ></div>

  </main>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script
    type="module"
    src="./js/main.js"
  ></script>

</body>

</html>
