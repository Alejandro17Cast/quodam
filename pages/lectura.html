<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Lectura breve e interactiva en Quodam."
  >

  <title>Quodam — Lectura</title>

  <link
    rel="stylesheet"
    href="../css/main.css"
  >
</head>


<body>

  <main class="reader">

    <!-- =========================
         CABECERA
    ========================== -->

    <header class="reader__header">

      <a
        href="../index.html"
        class="reader__back"
        aria-label="Volver a Quodam"
      >
        ← Volver
      </a>


      <a
        href="../index.html"
        class="reader__brand"
        aria-label="Ir al inicio de Quodam"
      >
        Quodam
      </a>

    </header>


    <!-- =========================
         LECTURA
    ========================== -->

    <section
      id="reading-container"
      class="reader__content"
      aria-live="polite"
    >

      <div class="reader__loading">

        <span
          class="reader__loading-icon"
          aria-hidden="true"
        >
          ✦
        </span>

        <p>
          Preparando tu lectura...
        </p>

      </div>

    </section>


    <!-- =========================
         ERROR
    ========================== -->

    <section
      id="reading-error"
      class="reader__error"
      hidden
    >

      <span
        class="reader__error-icon"
        aria-hidden="true"
      >
        ✦
      </span>

      <h1>
        Esta lectura se escondió
      </h1>

      <p>
        No pudimos encontrarla.
        Puedes regresar y descubrir otra.
      </p>

      <a
        href="../index.html"
        class="button button--primary"
      >
        Descubrir otra lectura
      </a>

    </section>

  </main>


  <script
    type="module"
    src="../js/modules/readingReader.js"
  ></script>

</body>

</html>
